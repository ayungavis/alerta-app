name: Release to TestFlight

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump_build:
        description: "Increment build number"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build and Upload to TestFlight
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Print tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
            BuildTools/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('BuildTools/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve build tools
        run: scripts/bootstrap.sh

      - name: Fetch latest App Store Connect build number
        id: asc_build
        if: github.event_name == 'release' || inputs.bump_build
        env:
          KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          mkdir -p "${HOME}/.appstoreconnect"
          printf '%s' "${KEY_BASE64}" | base64 -d > "${HOME}/.appstoreconnect/AuthKey_${KEY_ID}.p8"
          chmod 600 "${HOME}/.appstoreconnect/AuthKey_${KEY_ID}.p8"

          source scripts/appstore-jwt.sh
          JWT=$(jwt_token "${HOME}/.appstoreconnect/AuthKey_${KEY_ID}.p8" "${KEY_ID}" "${ISSUER_ID}")

          echo "Querying App Store Connect for latest build..."

          if ! curl -sf --connect-timeout 10 "https://api.appstoreconnect.apple.com" > /dev/null 2>&1; then
            echo "WARNING: Cannot reach api.appstoreconnect.apple.com (network issue). Falling back to pbxproj."
            echo "latest=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APPS_OUT=$(mktemp)
          APPS_HTTP=$(curl -s -o "${APPS_OUT}" -w '%{http_code}' \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=com.ayungavis.alerta&limit=1" || echo "000")

          if [ "${APPS_HTTP}" != "200" ]; then
            echo "WARNING: Could not fetch apps (HTTP ${APPS_HTTP}). Falling back to pbxproj."
            head -c 500 "${APPS_OUT}" 2>/dev/null || true
            echo "latest=0" >> "$GITHUB_OUTPUT"
            echo "Latest TestFlight build: unknown"
            exit 0
          fi

          APP_ID=$(python3 -c "import json,sys; d=json.load(sys.stdin); ds=d.get('data',[]); print(ds[0]['id']) if ds else sys.exit(1)" < "${APPS_OUT}")

          BUILDS_OUT=$(mktemp)
          BUILDS_HTTP=$(curl -s -o "${BUILDS_OUT}" -w '%{http_code}' \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/builds?filter%5Bapp%5D=${APP_ID}&sort=-version&limit=1" || echo "000")

          if [ "${BUILDS_HTTP}" != "200" ]; then
            echo "WARNING: Could not fetch builds (HTTP ${BUILDS_HTTP}). Falling back to pbxproj."
            head -c 500 "${BUILDS_OUT}" 2>/dev/null || true
            echo "latest=0" >> "$GITHUB_OUTPUT"
            echo "Latest TestFlight build: unknown"
            exit 0
          fi

          LATEST=$(python3 -c "import json,sys; d=json.load(sys.stdin); ds=d.get('data',[]); print(ds[0]['attributes']['version']) if ds else print('0')" < "${BUILDS_OUT}")

          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest TestFlight build: ${LATEST}"

      - name: Determine build number
        id: build_number
        run: |
          PBX_VERSION="$(xcrun agvtool what-version -terse 2>/dev/null || echo "1")"
          ASC_LATEST="${{ steps.asc_build.outputs.latest }}"
          ASC_LATEST="${ASC_LATEST:-0}"

          if [ "$ASC_LATEST" -gt "$PBX_VERSION" ]; then
            BASE="$ASC_LATEST"
          else
            BASE="$PBX_VERSION"
          fi
          NEW=$((BASE + 1))

          echo "current=${BASE}" >> "$GITHUB_OUTPUT"
          echo "next=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Build number: pbx=${PBX_VERSION}, asc=${ASC_LATEST} → ${NEW}"

      - name: Write and validate App Store Connect API key
        id: api_key
        env:
          KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          KEY_DIR="${HOME}/.appstoreconnect"
          KEY_PATH="${KEY_DIR}/AuthKey_${KEY_ID}.p8"

          mkdir -p "${KEY_DIR}"
          mkdir -p "${HOME}/private_keys"

          printf '%s' "${KEY_BASE64}" | base64 -d > "${KEY_PATH}"
          cp "${KEY_PATH}" "${HOME}/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "${KEY_PATH}"

          echo "path=${KEY_PATH}" >> "$GITHUB_OUTPUT"
          echo "Key written to ${KEY_PATH} ($(wc -c < "${KEY_PATH}") bytes)"

          export APPSTORE_KEY_ID="${KEY_ID}"
          export APPSTORE_ISSUER_ID="${ISSUER_ID}"
          echo "--- Validating credentials ---"
          scripts/verify-credentials.sh

      - name: Run lint checks
        run: scripts/lint.sh

      - name: Bump build number
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.next }}
        run: |
          echo "Bumping build number to ${BUILD_NUMBER}..."
          xcrun agvtool new-version -all "${BUILD_NUMBER}"

      - name: Archive and export
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_PATH: ${{ steps.api_key.outputs.path }}
        run: |
          echo "Archiving with build number $(xcrun agvtool what-version -terse)..."

          xcodebuild archive \
            -project AlertaApp.xcodeproj \
            -scheme AlertaApp \
            -configuration Release \
            -archivePath build/AlertaApp.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "${ISSUER_ID}" \
            -authenticationKeyID "${KEY_ID}" \
            -authenticationKeyPath "${KEY_PATH}"

          echo "Archive complete. Exporting IPA..."

          xcodebuild -exportArchive \
            -archivePath build/AlertaApp.xcarchive \
            -exportOptionsPlist scripts/ExportOptions.plist \
            -exportPath build/ \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "${ISSUER_ID}" \
            -authenticationKeyID "${KEY_ID}" \
            -authenticationKeyPath "${KEY_PATH}"

          echo "Export complete: $(ls -lh build/*.ipa)"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --file build/AlertaApp.ipa \
            --type ios \
            --apiKey "${KEY_ID}" \
            --apiIssuer "${ISSUER_ID}"

      - name: Sync build number to repository
        if: success()
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.next }}
        run: |
          xcrun agvtool new-version -all "${BUILD_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AlertaApp.xcodeproj/project.pbxproj
          git commit -m "ci: bump build number to ${BUILD_NUMBER}"
          git push origin HEAD:main

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-artifacts
          path: |
            build/*.ipa
            build/*.xcarchive/**/*.log
          retention-days: 7
