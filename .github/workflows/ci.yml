name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Lint and Build
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate bundle identifier
        run: |
          echo "Checking PRODUCT_BUNDLE_IDENTIFIER in project.pbxproj..."
          PBXPROJ="AlertaApp.xcodeproj/project.pbxproj"
          EXPECTED="com.ayungavis.alerta"

          VIOLATIONS=$(grep -n "PRODUCT_BUNDLE_IDENTIFIER" "${PBXPROJ}" | grep -v "${EXPECTED}" || true)

          if [[ -n "${VIOLATIONS}" ]]; then
            echo ""
            echo "ERROR: PRODUCT_BUNDLE_IDENTIFIER must always be '${EXPECTED}'."
            echo ""
            echo "Offending lines:"
            echo "${VIOLATIONS}"
            echo ""
            echo "Fix: Update all PRODUCT_BUNDLE_IDENTIFIER entries to '${EXPECTED}'."
            exit 1
          fi

          TOTAL=$(grep -c "PRODUCT_BUNDLE_IDENTIFIER" "${PBXPROJ}")
          echo "  ✓ All ${TOTAL} PRODUCT_BUNDLE_IDENTIFIER entries match '${EXPECTED}'"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Print tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
            BuildTools/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('BuildTools/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve build tools
        run: scripts/bootstrap.sh

      - name: Run checks
        run: scripts/check.sh
